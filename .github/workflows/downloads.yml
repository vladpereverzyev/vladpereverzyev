name: Update download count

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute total downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=0
          for repo in flipper-staff-time-clock lab-ledger; do
            n=$(gh api "repos/${{ github.repository_owner }}/$repo/releases" \
              --jq '[.[].assets[].download_count] | add // 0')
            total=$((total + n))
          done
          echo "Total downloads: $total"
          printf '{"schemaVersion":1,"label":"Downloads","message":"%s","color":"0e75b6"}\n' "$total" > downloads.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet downloads.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add downloads.json
            git commit -m "Update total download count"
            git push
          else
            echo "No change"
          fi
